<script>
const samplePayload=JSON.parse(document.getElementById('source-data').textContent);
const escapeHtml=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e=escapeHtml, yes=v=>v?'Có':'Không', money=(v,c='VND')=>v==null?'—':new Intl.NumberFormat('vi-VN',{style:'currency',currency:c}).format(v);
const time=v=>v?new Intl.DateTimeFormat('vi-VN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Ho_Chi_Minh'}).format(new Date(v*1000)):'—';
const labels={'Total Pages':'Số trang','Book printer/distributor':'Nhà in / phân phối','Import/Local':'Xuất xứ','ISBN':'ISBN','Edition Type':'Loại phiên bản','Year':'Năm xuất bản','Publishing Company':'Công ty phát hành','Language':'Ngôn ngữ','Cover Type':'Loại bìa'};
const values={'Local':'Trong nước','Regular Edition':'Bản thông thường','Vietnamese':'Tiếng Việt','Soft Cover':'Bìa mềm'};
const rows=entries=>'<dl>'+entries.map(([k,v])=>`<div class="row"><dt>${e(k)}</dt><dd>${e(v)}</dd></div>`).join('')+'</dl>';
const table=(heads,body)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
const safeUrl=url=>{try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function renderProducts(payload){
document.getElementById('app').innerHTML=payload.item_list.map((p,index)=>{
const price=p.price_info?.[0]??{}, stock=p.stock_info_v2??{}, summary=stock.summary_info??{}, dim=p.dimension??{};
const images=[...new Set(p.image?.image_url_list??[])].map(safeUrl).filter(Boolean);
const description=(p.description??'').split(/(?:^|\n)\*\*\*/).filter(Boolean).map(block=>{const split=block.indexOf('\n');return split<0?`<p>${e(block)}</p>`:`<h3>${e(block.slice(0,split))}</h3><p>${e(block.slice(split+1).trim())}</p>`}).join('');
return `<article class="product" data-index="${index}"><div class="card hero"><div>${images[0]?`<a href="${e(images[0])}" target="_blank" rel="noopener noreferrer"><img class="cover" src="${e(images[0])}" alt="${e(p.item_name)}"></a>`:'<p>Không có ảnh</p>'}<div class="image-note">${p.image?.image_url_list?.length??0} ảnh trong dữ liệu · ${images.length} ảnh khác nhau</div></div><div><div class="eyebrow">Mã sản phẩm ${e(p.item_id)}</div><h2>${e(p.item_name)}</h2><div class="badges"><span class="badge green">${p.item_status==='NORMAL'?'Trạng thái: Bình thường':e(p.item_status)}</span><span class="badge">${p.condition==='NEW'?'Sách mới':e(p.condition)}</span>${summary.total_available_stock===0?'<span class="badge orange">Hết hàng</span>':''}${p.has_promotion?'<span class="badge">Có khuyến mãi</span>':''}</div><div class="price">${money(price.current_price,price.currency)}<small>Giá gốc: ${money(price.original_price,price.currency)}</small></div><div class="metrics"><div class="metric"><strong>${e(summary.total_available_stock)}</strong><span>Tồn có thể bán</span></div><div class="metric"><strong>${e(summary.total_reserved_stock)}</strong><span>Tồn đã giữ</span></div><div class="metric"><strong>${e(p.pre_order?.days_to_ship)}</strong><span>Ngày chuẩn bị hàng</span></div></div><div class="meta"><span>SKU: <b>${e(p.item_sku)}</b></span><span>Thương hiệu: <b>${e(p.brand?.original_brand_name)}</b></span></div></div></div>

<div class="panel active" data-panel="overview"><div class="grid"><div class="card"><h3>Thông tin chung</h3>${rows([['ID sản phẩm',p.item_id],['SKU',p.item_sku],['ID danh mục',p.category_id],['Thương hiệu',p.brand?.original_brand_name],['ID thương hiệu',p.brand?.brand_id],['Có phân loại hàng',yes(p.has_model)],['Đặt hàng trước',yes(p.pre_order?.is_pre_order)],['Số lượng mua tối thiểu',p.purchase_limit_info?.min_purchase_limit],['Thời điểm tạo',time(p.create_time)],['Cập nhật gần nhất',time(p.update_time)]])}<p class="hint">Thời gian hiển thị theo múi giờ Việt Nam (UTC+7).</p></div><div class="card"><h3>Thuộc tính sản phẩm</h3>${table(['Thuộc tính','Giá trị'],(p.attribute_list??[]).map(a=>`<tr><td>${e(labels[a.original_attribute_name]??a.original_attribute_name)}<small>ID ${e(a.attribute_id)}${a.is_mandatory?' · Bắt buộc':''}</small></td><td>${(a.attribute_value_list??[]).map(v=>e(values[v.original_value_name]??v.original_value_name)+(v.value_unit?' '+e(v.value_unit):'')).join(', ')}</td></tr>`).join(''))}</div></div><div class="card" style="margin-top:20px"><h3>Ảnh sản phẩm</h3><div class="gallery">${images.map(url=>`<a href="${e(url)}" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="${e(url)}" alt="Ảnh ${e(p.item_name)}"></a>`).join('')}</div><p class="hint">Các URL ảnh trùng nhau được gộp khi hiển thị. Dữ liệu gốc được giữ đầy đủ trong tab JSON.</p></div></div>
<div class="panel" data-panel="description"><div class="card"><section class="description">${description}</section></div></div>
<div class="panel" data-panel="shipping"><div class="grid"><div class="card"><h3>Đóng gói & xử lý đơn</h3>${rows([['Khối lượng (weight)',p.weight],['Chiều dài (package_length)',dim.package_length],['Chiều rộng (package_width)',dim.package_width],['Chiều cao (package_height)',dim.package_height],['Thời gian chuẩn bị',`${p.pre_order?.days_to_ship??'—'} ngày`],['Fulfillment bởi Shopee',yes(p.is_fulfillment_by_shopee)]])}<p class="hint">Dữ liệu nguồn không ghi đơn vị khối lượng và kích thước.</p><h4>Tồn kho tổng hợp</h4>${rows([['Tồn có thể bán',summary.total_available_stock],['Tồn đã giữ',summary.total_reserved_stock],['Tồn ứng trước có thể bán',stock.advance_stock?.sellable_advance_stock],['Tồn ứng trước đang vận chuyển',stock.advance_stock?.in_transit_advance_stock]])}</div><div class="card"><h3>Tồn theo vị trí</h3>${table(['Loại kho','Vị trí','Tồn','Cho phép bán'],[...(stock.seller_stock??[]).map(s=>`<tr><td>Người bán</td><td>${e(s.location_id||'Không có mã')}</td><td>${e(s.stock)}</td><td>${yes(s.if_saleable)}</td></tr>`),...(stock.shopee_stock??[]).map(s=>`<tr><td>Shopee</td><td>${e(s.location_id||'Không có mã')}</td><td>${e(s.stock)}</td><td>—</td></tr>`)].join(''))}</div></div><div class="card" style="margin-top:20px"><h3>Phương thức vận chuyển</h3>${table(['Dịch vụ','ID','Trạng thái','Miễn phí','Lấy hàng'],(p.logistic_info??[]).map(l=>`<tr><td>${e(l.logistic_name)}</td><td>${e(l.logistic_id)}</td><td>${l.enabled?'Đang bật':'Đang tắt'}</td><td>${yes(l.is_free)}</td><td>${yes(l.include_pickup)}</td></tr>`).join(''))}</div></div>
<div class="panel" data-panel="raw"><div class="card"><div class="toolbar"><h3>Dữ liệu sản phẩm đầy đủ</h3><button class="download" data-download="${index}">Tải JSON</button></div><p class="hint">Giữ nguyên các trường của sản phẩm. Các trường không xuất hiện ở giao diện tổng quan vẫn có trong phần này.</p><pre>${e(JSON.stringify(p,null,2))}</pre></div></div></article>`;
}).join('')+'<p class="footer">Bản xem từ JSON đã nhập · Hình ảnh tải từ URL Shopee gốc và cần kết nối mạng.</p>';
document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{const root=button.closest('.product');root.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button))});root.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('active',p.dataset.panel===button.dataset.tab))}));
document.querySelectorAll('[data-download]').forEach(button=>button.addEventListener('click',()=>{const p=payload.item_list[Number(button.dataset.download)],url=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=`san-pham-${p.item_id}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}));
document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.hidden=true;const fallback=document.createElement('p');fallback.className='hint';fallback.textContent='Không tải được ảnh. Mở liên kết để xem ảnh gốc.';img.parentNode.append(fallback)},{once:true}));
}
const input=document.getElementById('json-input');
const status=document.getElementById('input-status');
const results=document.getElementById('results');
const formatted=document.getElementById('formatted-json');
const app=document.getElementById('app');
function parseInput(raw){
  const text=raw.replace(/^\uFEFF/,'').trim();
  if(!text)throw new Error('Bạn chưa nhập dữ liệu JSON.');
  try{return {data:JSON.parse(text),wrapped:false};}catch(originalError){
    // Accept a copied object member without discarding any trailing data.
    if(/^"item_list"\s*:/.test(text)){
      for(const candidate of ['{'+text+'}','{"response":{'+text]){
        try{return {data:JSON.parse(candidate),wrapped:true};}catch{}
      }
    }
    throw new Error('JSON chưa hợp lệ: '+originalError.message);
  }
}
function extractItems(data){
  if(Array.isArray(data))return data.filter(p=>p&&typeof p==='object'&&!Array.isArray(p)&&('item_id' in p||'item_name' in p));
  if(!data||typeof data!=='object')return [];
  if(Array.isArray(data.item_list))return data.item_list;
  if('item_id' in data||'item_name' in data)return [data];
  for(const key of ['response','data']){
    const items=extractItems(data[key]);
    if(items.length)return items;
  }
  return [];
}
function clearResults(){
  results.hidden=true;app.replaceChildren();formatted.textContent='';
}
function showInput(formatInput=false){
  clearResults();status.classList.remove('error');input.removeAttribute('aria-invalid');
  try{
    const parsed=parseInput(input.value);
    const pretty=JSON.stringify(parsed.data,null,2);
    const items=extractItems(parsed.data);
    formatted.textContent=pretty;
    if(formatInput)input.value=pretty;
    let productError=false;
    if(items.length){
      try{renderProducts({item_list:items});}catch{productError=true;app.replaceChildren();}
    }
    document.getElementById('formatted-details').open=!items.length||productError;
    results.hidden=false;
    status.textContent=productError?'JSON hợp lệ. Cấu trúc sản phẩm chưa phù hợp để tạo view; xem JSON đã format bên dưới.':items.length?'Đã hiển thị '+items.length+' sản phẩm từ JSON đã nhập.':'Đã format JSON. Không có dữ liệu sản phẩm để tạo view chi tiết.';
    if(parsed.wrapped)status.textContent+=' Đã bổ sung dấu ngoặc bao ngoài cho đoạn item_list.';
  }catch(error){
    clearResults();status.classList.add('error');status.textContent=error.message;input.setAttribute('aria-invalid','true');
  }
}
document.getElementById('json-form').addEventListener('submit',event=>{event.preventDefault();showInput();});
document.getElementById('format-input').addEventListener('click',()=>showInput(true));
document.getElementById('load-sample').addEventListener('click',()=>{input.value=JSON.stringify(samplePayload,null,2);showInput();});
document.getElementById('clear-input').addEventListener('click',()=>{input.value='';clearResults();status.textContent='';status.classList.remove('error');input.removeAttribute('aria-invalid');input.focus();});
input.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();showInput();}});
input.addEventListener('input',()=>{clearResults();status.classList.remove('error');status.textContent='Nhấn “Hiển thị” để xem dữ liệu vừa nhập.';input.removeAttribute('aria-invalid');});
input.value=JSON.stringify(samplePayload,null,2);
showInput();
</script></body></html>
